name: Case 5 - Multi-stage CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: 1. Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint tool
        run: pip install ruff

      - name: Check code quality
        run: ruff check main.py test_main.py --select E4,E7,E9,F

  tests:
    name: 2. Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -v

  build:
    name: 3. Build
    runs-on: ubuntu-latest
    needs: [lint, tests]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare application
        run: |
          mkdir -p dist
          cp main.py dist/
          cp requirements.txt dist/
          cd dist
          zip -r application.zip main.py requirements.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-application
          path: dist/application.zip

  deploy:
    name: 4. Deploy
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: pipeline-application

      - name: Extract application
        run: |
          unzip application.zip -d application
          ls -la application

      - name: Deployment simulation
        run: |
          echo "Starting deployment..."
          echo "Application package is ready."
          echo "Pipeline deployment completed successfully."
